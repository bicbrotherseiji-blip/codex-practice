<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI勉強会のご案内</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="event-page">
      <section class="hero" aria-label="AI勉強会イメージ画像">
        <img
          src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1800&q=80"
          alt="近未来的なホログラムを見つめる参加者たち"
        />
        <div class="hero-overlay"></div>
      </section>

      <section class="event-info" aria-label="イベント情報">
        <p class="eyebrow">社内イベント</p>
        <h1>AI勉強会 2026</h1>
        <ul>
          <li>
            <span class="label">開催日時</span>
            <span class="value">2026年4月17日（金）18:30〜20:00</span>
          </li>
          <li>
            <span class="label">場所</span>
            <span class="value">東京オフィス 12F イノベーションラウンジ</span>
          </li>
          <li>
            <span class="label">タイトル</span>
            <span class="value">生成AIを業務に活かす実践アイデア共有会</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
